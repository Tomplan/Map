name: Daily Database Backup

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 UTC every day
  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      simulate_failure:
        description: 'Fail on purpose to test the failure alert (no backup is made)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # open/close the "backup failed" alert issue

jobs:
  backup:
    name: Backup Supabase database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source (development branch)
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Simulate a failure (test of the alert)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Simulated failure to test the failure alert"
          exit 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full backup
        run: node scripts/backup/backup-full.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # SUPABASE_DB_PASSWORD not needed — backup uses JS client, not pg_dump
          SUPABASE_DB_PASSWORD: unused

      # Backups contain company/contact data: they go ONLY to the private repo, never to this public one.
      - name: Push backup to private repo (Tomplan/Map-backups)
        env:
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          BACKUP_DIR=$(ls -td backups/full-* | head -1)
          BACKUP_NAME=$(basename "$BACKUP_DIR")

          mkdir -p ~/.ssh
          printf '%s\n' "$BACKUP_DEPLOY_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/backup_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:Tomplan/Map-backups.git /tmp/backups-repo
          cp -r "$BACKUP_DIR" /tmp/backups-repo/
          cd /tmp/backups-repo

          # Rotate by folder name (mtimes are meaningless in a fresh clone): keep the 31 newest full-* folders
          ls -d full-* | sort -r | tail -n +32 | xargs -r rm -rf

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "backup: $BACKUP_NAME"
          git push origin HEAD:main

      # Alerts: the repo is public, so the issue only contains a link to the run (no data).
      # GitHub e-mails repo watchers/owners about new issues. The issue is closed again by the next
      # successful run.
      - name: Open or update an alert issue when the backup fails
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create backup-failed --color B60205 \
            --description "Daily database backup failed" 2>/dev/null || true
          existing=$(gh issue list --state open --label backup-failed --json number --jq '.[0].number // empty')
          body="The daily database backup failed on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            # Assigning the repository owner makes GitHub notify them even if they do not watch the repo
            gh issue create --label backup-failed --assignee "${{ github.repository_owner }}" \
              --title "Daily database backup failed" --body "$body"
          fi

      - name: Close the alert issue after a successful backup
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label backup-failed --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Backup succeeded again: $RUN_URL"
          done
