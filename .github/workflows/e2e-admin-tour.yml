name: 'E2E: Admin Tour (Puppeteer)'

on:
  pull_request:
    branches: [main]

jobs:
  e2e-admin-tour:
    name: Admin tour E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          # Opt-in to expose test helpers when building preview for CI.
          VITE_E2E_TEST_HELPERS: '1'
          # Also set a simple env var so runtime checks and Jest runs can
          # read a platform-agnostic E2E_TEST_HELPERS flag.
          E2E_TEST_HELPERS: '1'
        run: npm run build

      - name: Start preview server (background)
        # Use vite preview to serve the built site so the e2e script can hit it
        run: |
          npm run preview -- --port 5173 --strictPort --host 127.0.0.1 &> preview.log &
          echo $! > preview.pid

      - name: Wait for preview up
        run: npx wait-on http://127.0.0.1:5173/Map --timeout 120000

      - name: Run admin-tour E2E (Puppeteer)
        # Secrets are validated at runtime inside the step
        env:
          E2E_BASE: http://127.0.0.1:5173/Map
        run: |
          if [ -z "${{ secrets.E2E_ADMIN_EMAIL }}" ] || [ -z "${{ secrets.E2E_ADMIN_PASSWORD }}" ]; then
            echo "Admin credentials not present; skipping admin-tour E2E.";
            exit 0;
          fi
          export E2E_ADMIN_EMAIL="${{ secrets.E2E_ADMIN_EMAIL }}"
          export E2E_ADMIN_PASSWORD="${{ secrets.E2E_ADMIN_PASSWORD }}"
          npm run test:e2e:tour-admin

      - name: Run help-no-reopen E2E (Puppeteer)
        # Secrets are validated at runtime inside the step
        env:
          E2E_BASE: http://127.0.0.1:5173/Map
        run: |
          if [ -z "${{ secrets.E2E_ADMIN_EMAIL }}" ] || [ -z "${{ secrets.E2E_ADMIN_PASSWORD }}" ]; then
            echo "Admin credentials not present; skipping help-no-reopen E2E.";
            exit 0;
          fi
          export E2E_ADMIN_EMAIL="${{ secrets.E2E_ADMIN_EMAIL }}"
          export E2E_ADMIN_PASSWORD="${{ secrets.E2E_ADMIN_PASSWORD }}"
          npm run test:e2e:tour-help-no-reopen

      - name: Upload debug artifacts (preview.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-log
          path: preview.log

      - name: Capture processes & diagnostics
        if: always()
        run: |
          echo "--- ps aux ---" > process-list.txt || true
          ps aux >> process-list.txt || true
          echo "--- listening sockets (ss -lntp) ---" >> process-list.txt || true
          ss -lntp || true
          if command -v lsof >/dev/null 2>&1; then
            lsof -ti:5173 | xargs -r ps -o pid,ppid,cmd -p || true
            lsof -ti:5174 | xargs -r ps -o pid,ppid,cmd -p || true
          fi

      - name: Upload extra debug artifacts (process-list)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-admin-debug
          path: process-list.txt

      - name: Print preview log (for quick debugging)
        if: always()
        run: |
          echo "--- preview.log ---"
          if [ -f preview.log ]; then tail -n +1 preview.log || true; else echo "(no preview.log found)"; fi

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi
